name: "Update stars"
# This workflow runs at 00:30 everyday, fetching only new stars
on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    name: "Update README"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7
      - name: "Update stars and README"
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: "scripts/update.sh KROSF"
      - name: "Commit and push"
        run: |
          git add README.md stars.jsonl
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: update stars by GitHub Actions Workflow"
          git push
